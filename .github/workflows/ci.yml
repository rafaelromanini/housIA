name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (ruff + pytest, LLM mock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest
        env:
          LLM_MODE: mock
          FHIR_MODE: local

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  helm:
    name: Helm (lint + template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint deploy/helm/housia -f deploy/helm/housia/ci/lint-values.yaml
      - run: helm template housia deploy/helm/housia -f deploy/helm/housia/ci/lint-values.yaml > /dev/null
      - name: Sem valores obrigatórios o chart deve recusar renderizar
        run: "! helm template housia deploy/helm/housia"

  e2e:
    name: E2E (Playwright, 3 pilares)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Subir API (FHIR local, SQLite, LLM mock)
        working-directory: apps/api
        run: |
          pip install -e .
          LLM_MODE=mock FHIR_MODE=local DATABASE_URL=sqlite:///./e2e.db nohup uvicorn app.main:app --port 8000 &
      - name: Build e subir web
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          NEXT_PUBLIC_API_URL=http://localhost:8000 npm run build
          nohup npm start &
          npx wait-on -t 120000 http://localhost:3000/healthz http://127.0.0.1:8000/health
      - name: Playwright
        working-directory: apps/web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
