name: housia

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: housia
      POSTGRES_PASSWORD: housia
      POSTGRES_DB: housia
    volumes:
      - housia-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housia -d housia"]
      interval: 5s
      timeout: 3s
      retries: 10

  fhir:
    # HAPI FHIR R4 com pacientes sintéticos (simula o prontuário do hospital).
    # A imagem é distroless (sem shell), por isso não há healthcheck: o serviço `seed` espera o /metadata.
    image: hapiproject/hapi:v8.12.0-1
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.reuse_cached_search_results_millis: "0"
      hapi.fhir.client_id_strategy: ANY
    ports:
      - "8080:8080"

  seed:
    # Carrega os 6 cenários de demonstração + população de fundo no HAPI (idempotente: PUT por id).
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "/data/seed/load.py", "--wait"]
    environment:
      FHIR_BASE_URL: http://fhir:8080/fhir
    depends_on:
      fhir:
        condition: service_started
    restart: "no"

  mailpit:
    # Caixa de e-mail de desenvolvimento (#33): recebe verificação de cadastro, recuperação de senha e convites.
    # UI em http://localhost:8025; a API (GET /api/v1/messages) serve para ler o link nos testes.
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://housia:housia@db:5432/housia
      FHIR_MODE: hapi
      FHIR_BASE_URL: http://fhir:8080/fhir
      CORS_ORIGINS: http://localhost:3000
      # Demo: o HAPI é sintético, então a nota aprovada vai para o "prontuário" (ADR 0009). Desligue em produção.
      EHR_WRITEBACK: ${EHR_WRITEBACK:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      fhir:
        condition: service_started

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  housia-db:
