perguntas:
- id: pk_ped_01
  pergunta: Qual é o peso atual da criança? Foi pesada hoje?
  motivo: 'As doses pediátricas se calculam por mg/kg: sem peso recente a conferência de dose não vale.'
  ja_perguntado:
  - quantos quilos
  - pesou
  - peso da
  - peso dele
  - peso dela
  - quilos
  prioridade: alta
  fonte: 'Sociedade Brasileira de Pediatria: prescrição pediátrica por peso'
  idade_max: 17
- id: pk_ped_02
  pergunta: Qual o remédio que já deu em casa, em que dose e de quanto em quanto tempo?
  motivo: Dose repetida ou acima do máximo por peso é causa evitável de intoxicação (paracetamol, dipirona).
  ja_perguntado:
  - que remedio deu
  - quantas gotas
  - quantos ml
  - de quanto em quanto
  prioridade: alta
  fonte: Sociedade Brasileira de Pediatria; bulas (ANVISA)
  idade_max: 17
