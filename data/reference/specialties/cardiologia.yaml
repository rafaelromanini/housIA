perguntas:
- id: pk_card_01
  pergunta: 'Qual esforço faz a falta de ar aparecer: subir um lance de escada, andar no plano, tomar banho ou em repouso?'
  motivo: Define a classe funcional NYHA, que muda a conduta na insuficiência cardíaca.
  ja_perguntado:
  - subir escada
  - andar no plano
  - lance de escada
  - em repouso
  - quantas quadras
  prioridade: alta
  fonte: 'Diretriz Brasileira de Insuficiência Cardíaca Crônica (SBC): classificação NYHA'
- id: pk_card_02
  pergunta: Dorme com mais de um travesseiro ou acorda de madrugada sem ar?
  motivo: Ortopneia e dispneia paroxística noturna sustentam congestão pulmonar.
  ja_perguntado:
  - travesseiro
  - acorda sem ar
  - acordo sem ar
  - ortopneia
  - dormir sentado
  prioridade: media
  fonte: Diretriz Brasileira de Insuficiência Cardíaca Crônica (SBC)
