id: pediatria
versao: 1.0.0
rotulo: Consulta pediátrica
titulo: Nota de consulta pediátrica
tipo: consulta
especialidades:
- pediatria
automatico: true
loinc:
  codigo: 11488-4
  display: Consult note
fonte: Caderneta da Criança (Ministério da Saúde); Calendário Nacional de Vacinação (PNI)
secoes:
- key: queixa_principal
  rotulo: Queixa principal
  soap: S
  obrigatoria: true
  dica: Motivo do atendimento nas palavras do paciente.
  loinc: 10154-3
- key: hda
  rotulo: História da doença atual
  soap: S
  obrigatoria: false
  dica: Início, evolução, fatores de piora e melhora, sintomas associados.
  loinc: 10164-2
- key: gestacao_parto
  rotulo: Gestação e parto
  soap: S
  obrigatoria: false
  dica: Tipo de parto, idade gestacional e intercorrências.
  campo: gestacao_parto
- key: antecedentes
  rotulo: Antecedentes
  soap: S
  obrigatoria: false
  dica: Doenças prévias, cirurgias e história familiar.
  loinc: 11348-0
- key: alimentacao
  rotulo: Alimentação
  soap: S
  obrigatoria: false
  dica: Aleitamento, fórmula, introdução alimentar, apetite.
  palavras:
  - leite
  - mama
  - amamenta
  - mamadeira
  - papinha
  - alimenta
  - 'come '
  - comida
  - apetite
- key: vacinas
  rotulo: Vacinação
  soap: S
  obrigatoria: true
  dica: Situação do calendário vacinal e vacinas em atraso.
  loinc: 11369-6
  campo: vacinas
- key: dnpm
  rotulo: Desenvolvimento neuropsicomotor (DNPM)
  soap: S
  obrigatoria: true
  dica: 'Marcos para a idade: sustento cefálico, sentar, andar, fala.'
  campo: dnpm
- key: alergias
  rotulo: Alergias
  soap: S
  obrigatoria: false
  dica: Alergias e reações adversas conhecidas.
  loinc: 48765-2
- key: medicacoes
  rotulo: Medicações em uso
  soap: S
  obrigatoria: false
  dica: Inclui o que o paciente toma por conta própria.
  loinc: 10160-0
- key: peso
  rotulo: Peso
  soap: O
  obrigatoria: true
  dica: Peso atual em kg (confira a curva de crescimento).
  loinc: 29463-7
  padrao: '{{peso}}'
- key: estatura
  rotulo: Estatura
  soap: O
  obrigatoria: false
  dica: Comprimento ou altura em cm.
  loinc: 8302-2
  padrao: '{{estatura}}'
  palavras:
  - estatura
  - altura
  - comprimento
- key: perimetro_cefalico
  rotulo: Perímetro cefálico
  soap: O
  obrigatoria: false
  dica: Obrigatório de rotina até os 2 anos.
  loinc: 8287-5
  palavras:
  - perimetro cefalico
- key: exame_fisico
  rotulo: Exame físico
  soap: O
  obrigatoria: false
  dica: Só o que foi medido ou verbalizado.
  loinc: 29545-1
- key: avaliacao
  rotulo: Avaliação
  soap: A
  obrigatoria: true
  dica: Raciocínio clínico e hipóteses, com CID-10.
  loinc: 51848-0
- key: plano
  rotulo: Plano
  soap: P
  obrigatoria: false
  dica: Condutas combinadas; o que não foi combinado fica como "a confirmar".
  loinc: 18776-5
