- key: ipss
  rotulo: IPSS (escore de sintomas prostáticos)
  soap: S
  obrigatoria: false
  dica: 'Sete perguntas, 0 a 35 pontos: leve até 7, moderado de 8 a 19, grave de 20 em diante. O texto abaixo traz o relato
    para pontuar.'
  palavras:
  - jato
  - nocturia
  - noturia
  - levanta a noite
  - levanta de noite
  - esvazi
  - esforco para urinar
  - urgencia
  - intervalo
  - pinga
