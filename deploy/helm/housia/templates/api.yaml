apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "housia.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "housia.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api }}
          env:
            - name: ENV
              value: production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "housia.secretName" . }}
                  key: postgres-password
            - name: DATABASE_URL
              value: postgresql+psycopg://housia:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-db:5432/housia
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "housia.secretName" . }}
                  key: jwt-secret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "housia.secretName" . }}
                  key: anthropic-api-key
            - name: LLM_MODE
              value: {{ .Values.llm.mode | quote }}
            - name: ALLOW_MOCK
              value: {{ .Values.llm.allowMock | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: LLM_REGION
              value: {{ .Values.llm.region | quote }}
            - name: FHIR_MODE
              value: hapi
            - name: FHIR_BASE_URL
              value: {{ include "housia.fhirUrl" . | quote }}
            - name: CORS_ORIGINS
              value: https://{{ include "housia.domain" . }}
            - name: EHR_WRITEBACK
              value: {{ .Values.ehrWriteback | quote }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
