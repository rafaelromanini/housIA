{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "housia.secretName" . }}
  labels: {{- include "housia.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "defina secrets.jwtSecret (mínimo 32 caracteres)" .Values.secrets.jwtSecret | quote }}
  postgres-password: {{ required "defina secrets.postgresPassword" .Values.secrets.postgresPassword | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
{{- end }}
